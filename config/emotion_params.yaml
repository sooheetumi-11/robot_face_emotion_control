face_emotion_node:
  ros__parameters:
    camera_id: 0
    frame_width: 640
    frame_height: 480
    min_confidence: 0.60
    stable_frames: 3
    stable_ratio: 0.6
    show_window: true
    detector_backend: "opencv"
    emotion_topic: "/face_emotion"
    control_state_topic: "/emotion_control_state"

emotion_behavior_node:
  ros__parameters:
    cmd_vel_topic: "/cmd_vel"
    emotion_topic: "/face_emotion"
    control_state_topic: "/emotion_control_state"
    min_confidence: 0.60
    linear_speed: 0.15
    angular_speed: 0.40
    gentle_speed: 0.10
    rotation_speed: 0.60
    rotation_scale: 1.0
    max_linear_speed: 0.25
    max_angular_speed: 0.90
    linear_accel_limit: 0.35
    angular_accel_limit: 0.90
    action_timeout: 20.0
    watchdog_timeout: 1.0
    control_rate: 20.0
    continuous_mode: true
    curve_duration: 3.0
    gentle_duration: 2.0
